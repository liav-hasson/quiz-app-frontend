name: Build & Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - "react-app/**"
      - "ci/app-dockerfile/**"
      - ".github/workflows/build-push.yaml"
  workflow_dispatch:

env:
  DOCKER_IMAGE: liavvv/quiz-app-front

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for version tagging

      - name: Compute next version
        id: version
        run: |
          chmod +x scripts/compute_next_version.sh
          VERSION=$(./scripts/compute_next_version.sh . auto)
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: react-app
          file: ci/app-dockerfile/Dockerfile
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            VITE_APP_VERSION=${{ steps.version.outputs.tag }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag release in git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Summary
        run: |
          echo "### Docker Image Published :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Update Helm chart tag to:** \`${{ steps.version.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Update homelab chart version
        env:
          HOMELAB_PAT: ${{ secrets.HOMELAB_PAT }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          git clone https://x-access-token:${HOMELAB_PAT}@github.com/liav-hasson/homelab.git /tmp/homelab
          cd /tmp/homelab
          VALUES=quizlabs/charts/workloads/quiz-frontend/values.yaml
          sed -i "s|^\(  tag: \).*|\1\"${VERSION}\"|" "$VALUES"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add "$VALUES"
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "bump: quiz-frontend ${VERSION}"
          git push origin main
